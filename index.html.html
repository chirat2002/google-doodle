<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Doodle Sudden Death Quiz Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- หน้าจอตั้งค่า (Setup Screen) -->
    <div id="setup-screen" class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700 text-center">
        <h1 class="text-3xl font-bold mb-2 text-yellow-400">🎨 Google Doodle Quiz</h1>
        <p class="text-slate-400 mb-6">โหมด Sudden Death จับเวลาสลับฝั่ง</p>

        <div class="mb-4 text-left">
            <label class="block text-sm font-medium mb-1 text-slate-300">จำนวนทีมที่แข่งขัน:</label>
            <select id="num-teams" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-white focus:ring-2 focus:ring-yellow-400 outline-none cursor-pointer">
                <option value="2">2 ทีม (Team A / Team B)</option>
                <option value="3">3 ทีม (Team A / Team B / Team C)</option>
                <option value="4">4 ทีม (Team A / Team B / Team C / Team D)</option>
            </select>
        </div>

        <div class="mb-4 text-left">
            <label class="block text-sm font-medium mb-1 text-slate-300">เวลารวมเริ่มต้นต่อทีม (วินาที):</label>
            <select id="start-time" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-white focus:ring-2 focus:ring-yellow-400 outline-none cursor-pointer">
                <option value="45">45 วินาที (เร็วพิเศษ)</option>
                <option value="60" selected>60 วินาที (มาตรฐาน)</option>
                <option value="90">90 วินาที (ผ่อนคลาย)</option>
                <option value="120">120 วินาที (มาราธอน)</option>
            </select>
        </div>

        <div class="mb-6 text-left flex items-center justify-between bg-slate-900/50 p-3 rounded-xl border border-slate-700">
            <span class="text-sm text-slate-300 font-medium">🔀 สุ่มลำดับทีมก่อนเริ่มเกม:</span>
            <input type="checkbox" id="shuffle-teams" checked class="w-5 h-5 accent-yellow-400 rounded cursor-pointer">
        </div>

        <button onclick="startGame()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold py-3 px-6 rounded-xl transition shadow-lg text-lg cursor-pointer">
            🚀 เริ่มเกมแข่งขัน
        </button>
    </div>

    <!-- หน้าจอเล่นเกม (Game Screen) -->
    <div id="game-screen" class="hidden w-full max-w-4xl flex flex-col items-center">
        <!-- แถบแสดงสถานะเวลาแต่ละทีม -->
        <div id="teams-container" class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full mb-6"></div>

        <!-- กล่องคำถามและรูปภาพ -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full shadow-xl text-center relative">
            <div id="question-counter" class="absolute top-4 left-6 text-slate-400 text-sm">ข้อที่ 1</div>
            <div id="current-turn-badge" class="absolute top-4 right-6 bg-yellow-500 text-slate-950 px-3 py-1 rounded-full text-xs font-bold animate-pulse">ตาของ: ทีม A</div>

            <div class="my-4 flex justify-center">
                <img id="doodle-img" src="" alt="Google Doodle" class="max-h-56 object-contain rounded-lg border border-slate-600 bg-white p-2 shadow-inner">
            </div>

            <!-- กล่องคำใบ้ -->
            <div id="hints-container" class="space-y-2 mb-6 text-left max-w-xl mx-auto"></div>

            <!-- ปุ่มควบคุมเกม -->
            <div class="flex flex-wrap justify-center gap-3">
                <button onclick="useHint()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2.5 rounded-xl font-medium transition text-sm cursor-pointer active:scale-95">💡 เปิดคำใบ้ (-2s, -3s, -5s)</button>
                <button onclick="wrongAnswer()" class="bg-red-600 hover:bg-red-500 px-4 py-2.5 rounded-xl font-medium transition text-sm cursor-pointer active:scale-95">❌ ตอบผิด (-3s)</button>
                <button onclick="correctAnswer()" class="bg-green-600 hover:bg-green-500 px-6 py-2.5 rounded-xl font-bold transition shadow-lg cursor-pointer active:scale-95">✅ ตอบถูก (ผ่าน)</button>
            </div>
        </div>
    </div>

    <!-- Modal จบเกม -->
    <div id="game-over-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl max-w-md w-full text-center shadow-2xl">
            <h2 id="winner-text" class="text-3xl font-bold text-yellow-400 mb-4">🏆 ทีมชนะเลิศ!</h2>
            <p class="text-slate-300 mb-6">เกมการแข่งขันสิ้นสุดลงแล้ว</p>
            <button onclick="location.reload()" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold py-3 px-6 rounded-xl w-full cursor-pointer">
                🔄 เล่นใหม่อีกครั้ง
            </button>
        </div>
    </div>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
